name: Update UKMTO incidents

on:
  workflow_dispatch:
  schedule:
    - cron: "/15 * * * *"
    
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.x"

  - name: Install dependencies
    run: |
      pip install requests beautifulsoup4

  - name: Update UKMTO data
    run: python update_ukmto.py

  - name: Commit updated incidents
    run: |
      git config user.name "UKMTO Signage Bot"
      git config user.email "actions@users.noreply.github.com"
      git add incidents.json
      git diff --cached --quiet || \
      git commit -m "Update UKMTO incidents"
      git push
