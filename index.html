<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=1920, height=1080"> <title>UKMTO Maritime Security</title> <style> * { box-sizing: border-box; } html, body { margin: 0; width: 100%; height: 100%; background: #07131f; color: #ffffff; font-family: Arial, Helvetica, sans-serif; overflow: hidden; } .header { height: 130px; background: #0b2235; border-bottom: 4px solid #18a8d8; display: flex; align-items: center; padding: 0 55px; } .logo { font-size: 42px; font-weight: 700; letter-spacing: 2px; } .subtitle { margin-left: 30px; font-size: 25px; color: #8fb5c8; } .live { margin-left: auto; color: #46e68a; font-size: 24px; font-weight: bold; } .content { height: calc(100% - 200px); padding: 35px 55px; } .section-title { font-size: 28px; color: #62c9ed; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; } .incident { background: #102b40; border-left: 8px solid #e34b4b; margin-bottom: 22px; padding: 25px 30px; min-height: 190px; } .incident.suspicious { border-left-color: #f3c34b; } .incident.info { border-left-color: #38a8dc; } .meta { color: #91b4c7; font-size: 21px; margin-bottom: 10px; } .type { font-size: 34px; font-weight: bold; margin-bottom: 8px; } .location { font-size: 25px; color: #61c8ed; margin-bottom: 14px; } .description { font-size: 23px; line-height: 1.35; color: #e7f0f5; } .footer { height: 70px; position: absolute; bottom: 0; left: 0; right: 0; background: #06101a; border-top: 2px solid #19384d; display: flex; align-items: center; padding: 0 55px; color: #7695a6; font-size: 20px; } .source { color: #62c9ed; } .updated { margin-left: auto; } .loading { font-size: 28px; color: #8fb5c8; padding-top: 30px; } </style> </head> <body> <header class="header"> <div class="logo">UKMTO</div> <div class="subtitle">MARITIME SECURITY INCIDENTS</div> <div class="live">● LIVE MONITOR</div> </header> <main class="content"> <div class="section-title">Latest Maritime Security Activity</div> <div id="incidents"> <div class="loading"> Loading latest UKMTO incidents... </div> </div> </main> <footer class="footer"> <div> SOURCE: <span class="source">UK MARITIME TRADE OPERATIONS</span> </div> <div class="updated" id="updated"> Updating... </div> </footer> <script> /* * Temporary demonstration data. * * We will replace this section with the live UKMTO feed once * the data source is connected. */ const incidents = [ { type: "MARITIME SECURITY WARNING", location: "UKMTO AREA OF OPERATIONS", date: "LATEST REPORT", description: "Live UKMTO incident information will appear here once the feed is connected." } ]; function displayIncidents() { const container = document.getElementById("incidents"); container.innerHTML = incidents.map((incident) => { let cls = "incident"; if ( incident.type.toLowerCase().includes("suspicious") ) { cls += " suspicious"; } return ` <div class="${cls}"> <div class="meta">${incident.date}</div> <div class="type">${incident.type}</div> <div class="location">${incident.location}</div> <div class="description">${incident.description}</div> </div> `; }).join(""); document.getElementById("updated").textContent = "PAGE REFRESH: " + new Date().toLocaleTimeString(); } displayIncidents(); /* * Refresh the page every 5 minutes. */ setInterval(() => { location.reload(); }, 300000); </script> </body> </html>
