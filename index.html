<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=1920, height=1080"> <meta http-equiv="refresh" content="300"> <title>UKMTO Maritime Security</title> <style> * { box-sizing: border-box; } html, body { margin: 0; width: 100%; height: 100%; background: #06121d; color: #ffffff; font-family: Arial, Helvetica, sans-serif; overflow: hidden; } .header { height: 125px; background: #0a2235; border-bottom: 4px solid #16a9dc; display: flex; align-items: center; padding: 0 55px; } .logo { font-size: 43px; font-weight: 700; letter-spacing: 3px; } .subtitle { margin-left: 30px; font-size: 25px; color: #8eafc1; letter-spacing: 1px; } .live { margin-left: auto; color: #45e487; font-size: 23px; font-weight: bold; } .content { height: calc(100% - 195px); padding: 30px 55px; } .section-title { font-size: 27px; color: #55c6ed; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; } .incident { background: #102a3e; border-left: 8px solid #df4545; margin-bottom: 18px; padding: 20px 27px; min-height: 175px; } .incident.boarding { border-left-color: #f09b38; } .incident.suspicious { border-left-color: #f2c344; } .incident.other { border-left-color: #399bd0; } .meta { color: #91b2c4; font-size: 19px; margin-bottom: 7px; } .type { font-size: 31px; font-weight: bold; margin-bottom: 6px; } .location { font-size: 23px; color: #5fc8ed; margin-bottom: 10px; } .description { font-size: 21px; line-height: 1.32; color: #e2edf2; } .loading { font-size: 25px; color: #8eafc1; padding-top: 30px; } .error { font-size: 24px; color: #f28b8b; padding: 25px; background: #29151a; } .footer { height: 70px; position: absolute; bottom: 0; left: 0; right: 0; background: #050e17; border-top: 2px solid #19384c; display: flex; align-items: center; padding: 0 55px; color: #718d9d; font-size: 19px; } .source { color: #55c6ed; } .updated { margin-left: auto; } </style> </head> <body> <header class="header"> <div class="logo">UKMTO</div> <div class="subtitle">MARITIME SECURITY INCIDENTS</div> <div class="live">● LIVE MONITOR</div> </header> <main class="content"> <div class="section-title">Latest Maritime Security Activity</div>
<div id="incidents">
    <div class="loading">Loading latest incidents...</div>
</div>
</main> <footer class="footer"> <div> SOURCE: <span class="source">UK MARITIME TRADE OPERATIONS</span> </div> <div class="updated" id="updated"> Connecting to live feed... </div> </footer> <script> async function loadIncidents() { const container = document.getElementById("incidents"); try { const response = await fetch( "incidents.json?t=" + Date.now(), { cache: "no-store" } ); if (!response.ok) { throw new Error("Feed unavailable"); } const incidents = await response.json(); if (!Array.isArray(incidents) || incidents.length === 0) { throw new Error("No incidents available"); } container.innerHTML = incidents .slice(0, 4) .map(incident => { const type = (incident.type || "MARITIME SECURITY").toUpperCase(); let className = "incident"; if (type.includes("BOARD")) { className += " boarding"; } else if (type.includes("SUSPICIOUS")) { className += " suspicious"; } else if ( !type.includes("ATTACK") && !type.includes("HIJACK") ) { className += " other"; } return ` <div class="${className}"> <div class="meta"> ${incident.number || ""} ${incident.date ? " • " + incident.date : ""} </div> <div class="type"> ${type} </div> <div class="location"> ${incident.location || "Location not specified"} </div> <div class="description"> ${incident.description || ""} </div> </div> `; }) .join(""); document.getElementById("updated").textContent = "LAST DATA UPDATE: " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " • AUTO REFRESH: 5 MIN"; } catch (error) { container.innerHTML = ` <div class="error"> Unable to retrieve the live UKMTO incident feed. The display will automatically retry. </div> `; document.getElementById("updated").textContent = "FEED CONNECTION ERROR • RETRYING"; } } loadIncidents(); setInterval(loadIncidents, 300000); </script> </body> </html>
